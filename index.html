<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Watches</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header-logo">
            Odin-Watches
        </div>
        <div class="header-links">
            <ul>
                <li>Shop</li>
                <li>Explore</li>
                <li>Contact</li>
            </ul>
        </div>
    </header>
    <section class="hero">
        <div class="hero-text">
            <h1>ODIN WATCHES</h1>
            <h2>Timeless Elegance, Modern Nordic Design</h2>
            <button>Shop Now</button>
        </div>
        <div class="hero-image">
            <img src="https://images.pexels.com/photos/9790169/pexels-photo-9790169.png" alt="hero-image">
        </div>
    </section>
    <section class="info">
        <h1>Some of our Nordic Watches</h1>
        <div class="cards">
            <div class="card">
                <img src="https://images.pexels.com/photos/30250930/pexels-photo-30250930.jpeg" alt="watch-image01">
                <h2>Loki-Times</h2>
            </div>
            <div class="card">
                <img src="https://images.pexels.com/photos/37050003/pexels-photo-37050003.jpeg" alt="watch-image02">
                <h2>Thunder-Wrath</h2>
            </div>
            <div class="card">
                <img src="https://images.pexels.com/photos/30250930/pexels-photo-30250930.jpeg" alt="watch-image03">
                <h2>Freya's Grace</h2>
            </div>
            <div class="card">
                <img src="https://images.pexels.com/photos/37050003/pexels-photo-37050003.jpeg" alt="watch-image04">
                <h2>Odin's Fury</h2>
            </div>
        </div>
    </section>
</body>

</html>
